services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_transport

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_transport"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/employee_transport
      NODE_ENV: production
      PORT: 5000

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/server.js"


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      - backend


volumes:
  postgres_data: