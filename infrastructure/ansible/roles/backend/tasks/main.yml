---
- name: Ensure backend deployment directory exists
  ansible.builtin.file:
    path: /opt/routepilot
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"


# ---------------------------------------------------------
# Detect the currently deployed Git commit
# ---------------------------------------------------------

- name: Check whether RoutePilot Git repository already exists
  ansible.builtin.stat:
    path: /opt/routepilot/.git
  register: routepilot_git_repo


- name: Get currently deployed Git commit
  ansible.builtin.command:
    cmd: git -C /opt/routepilot rev-parse HEAD
  register: backend_commit_before
  changed_when: false
  when: routepilot_git_repo.stat.exists


# ---------------------------------------------------------
# Update the repository
# ---------------------------------------------------------

- name: Clone or update RoutePilot repository
  ansible.builtin.git:
    repo: "https://github.com/Nadaaath/routepilot.git"
    dest: /opt/routepilot
    version: main
    update: true
    force: false
  become_user: ubuntu
  register: routepilot_repo


- name: Get Git commit after repository update
  ansible.builtin.command:
    cmd: git -C /opt/routepilot rev-parse HEAD
  register: backend_commit_after
  changed_when: false


# ---------------------------------------------------------
# Detect whether BACKEND CODE actually changed
# ---------------------------------------------------------

- name: Find changed backend files
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/routepilot
      - diff
      - --name-only
      - "{{ backend_commit_before.stdout }}"
      - "{{ backend_commit_after.stdout }}"
      - --
      - backend/
  register: backend_changed_files
  changed_when: false
  when:
    - routepilot_git_repo.stat.exists
    - backend_commit_before.stdout != backend_commit_after.stdout


- name: Decide whether backend image must be rebuilt
  ansible.builtin.set_fact:
    backend_source_changed: >-
      {{
        (not routepilot_git_repo.stat.exists)
        or
        (
          backend_changed_files.stdout | default('') | trim | length > 0
        )
      }}


# ---------------------------------------------------------
# Backend configuration
# ---------------------------------------------------------

- name: Ensure RoutePilot configuration directory exists
  ansible.builtin.file:
    path: /etc/routepilot
    state: directory
    owner: root
    group: root
    mode: "0700"


- name: Check backend environment file
  ansible.builtin.stat:
    path: /etc/routepilot/backend.env
  register: backend_env


- name: Stop deployment if backend environment file is missing
  ansible.builtin.fail:
    msg: >
      /etc/routepilot/backend.env does not exist.
      Backend secrets must not be stored directly in GitHub.
  when: not backend_env.stat.exists


- name: Ensure backend environment file permissions are secure
  ansible.builtin.file:
    path: /etc/routepilot/backend.env
    owner: root
    group: root
    mode: "0600"


# ---------------------------------------------------------
# Docker image
# ---------------------------------------------------------

- name: Build RoutePilot backend Docker image
  community.docker.docker_image:
    name: routepilot-backend
    tag: "1.0"
    source: build
    build:
      path: /opt/routepilot/backend
    force_source: "{{ backend_source_changed | bool }}"
  register: backend_image


# ---------------------------------------------------------
# Backend container
# ---------------------------------------------------------

- name: Run RoutePilot backend container
  community.docker.docker_container:
    name: routepilot-backend
    image: routepilot-backend:1.0
    state: started
    restart_policy: unless-stopped

    env_file: /etc/routepilot/backend.env

    published_ports:
      - "8000:8000"

    recreate: "{{ backend_image.changed | bool }}"

# ---------------------------------------------------------
# Database migrations
# ---------------------------------------------------------

- name: Apply Prisma database migrations
  ansible.builtin.command:
    cmd: docker exec routepilot-backend npx prisma migrate deploy
  register: prisma_migrate
  changed_when: >
    'No pending migrations to apply' not in prisma_migrate.stdout