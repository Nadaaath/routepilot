---
# ============================================================
# ROUTEPILOT BACKEND DEPLOYMENT
# ============================================================
#
# Jenkins builds and publishes the backend Docker image.
#
# The backend VM does NOT build application source anymore.
# It pulls and runs the exact immutable image produced by CI.
# ============================================================


# ------------------------------------------------------------
# Validate deployment input
# ------------------------------------------------------------

- name: Validate backend deployment variables
  ansible.builtin.assert:
    that:
      - routepilot_image_tag is defined
      - routepilot_image_tag | length > 0
      - ghcr_username is defined
      - ghcr_username | length > 0
      - ghcr_token is defined
      - ghcr_token | length > 0

    fail_msg: >-
      RoutePilot image tag or GHCR credentials are missing.

  no_log: true

# ------------------------------------------------------------
# Remove legacy source-code deployment
# ------------------------------------------------------------

- name: Remove legacy RoutePilot source checkout
  ansible.builtin.file:
    path: /opt/routepilot
    state: absent


# ------------------------------------------------------------
# Runtime configuration
# ------------------------------------------------------------

- name: Ensure RoutePilot configuration directory exists
  ansible.builtin.file:
    path: /etc/routepilot
    state: directory
    owner: root
    group: root
    mode: "0700"


- name: Deploy backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: /etc/routepilot/backend.env
    owner: root
    group: root
    mode: "0600"

  no_log: true
  register: backend_env_config


# ------------------------------------------------------------
# Pull exact CI artifact
# ------------------------------------------------------------

- name: Deploy RoutePilot backend Docker image
  block:

    - name: Authenticate backend host to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: true

      no_log: true


    - name: Pull RoutePilot backend image
      community.docker.docker_image:
        name: ghcr.io/nadaaath/routepilot-backend
        tag: "{{ routepilot_image_tag }}"
        source: pull
        state: present

      register: backend_image


    - name: Run RoutePilot backend container
      community.docker.docker_container:
        name: routepilot-backend

        image: >-
          ghcr.io/nadaaath/routepilot-backend:{{ routepilot_image_tag }}

        state: started
        restart_policy: unless-stopped

        env_file: /etc/routepilot/backend.env

        published_ports:
          - "8000:8000"

        recreate: >-
          {{
            (backend_image.changed | default(false))
            or
            (backend_env_config.changed | default(false))
          }}


  always:

    - name: Log backend host out from GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        state: absent

      no_log: true


# ------------------------------------------------------------
# Prisma migrations
# ------------------------------------------------------------

- name: Apply Prisma database migrations
  ansible.builtin.command:
    cmd: >-
      docker exec routepilot-backend
      npx prisma migrate deploy

  register: prisma_migrate

  changed_when: >-
    'No pending migrations to apply'
    not in prisma_migrate.stdout