---
- name: Install Prometheus Blackbox Exporter
  ansible.builtin.apt:
    name: prometheus-blackbox-exporter
    state: present
    update_cache: true

- name: Deploy Blackbox Exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/prometheus/blackbox.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Blackbox Exporter

- name: Ensure Blackbox Exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-blackbox-exporter
    enabled: true
    state: started