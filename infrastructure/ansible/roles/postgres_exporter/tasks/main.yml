---
- name: Install PostgreSQL exporter
  ansible.builtin.apt:
    name: prometheus-postgres-exporter
    state: present
    update_cache: true

- name: Ensure PostgreSQL exporter role exists
  become_user: postgres
  ansible.builtin.shell: |
    psql -v ON_ERROR_STOP=1 <<'SQL'
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1
        FROM pg_roles
        WHERE rolname = 'postgres_exporter'
      ) THEN
        CREATE ROLE postgres_exporter LOGIN;
      END IF;
    END
    $$;
    SQL
  args:
    executable: /bin/bash
  changed_when: false

- name: Configure PostgreSQL exporter role
  become_user: postgres
  ansible.builtin.shell: |
    psql \
      -v ON_ERROR_STOP=1 \
      -v exporter_password="$POSTGRES_EXPORTER_PASSWORD" <<'SQL'
    ALTER ROLE postgres_exporter PASSWORD :'exporter_password';
    GRANT pg_monitor TO postgres_exporter;
    SQL
  args:
    executable: /bin/bash
  environment:
    POSTGRES_EXPORTER_PASSWORD: "{{ vault_postgres_exporter_password }}"
  no_log: true
  changed_when: false

- name: Configure PostgreSQL exporter datasource
  ansible.builtin.template:
    src: postgres-exporter-default.j2
    dest: /etc/default/prometheus-postgres-exporter
    owner: root
    group: root
    mode: "0600"
  notify: Restart PostgreSQL exporter

- name: Ensure PostgreSQL exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    enabled: true
    state: started