---
# ============================================================
# ROUTEPILOT FRONTEND DEPLOYMENT
# ============================================================
#
# Jenkins builds and publishes the frontend Docker image.
#
# The frontend VM only pulls and runs the exact artifact
# produced by the CI pipeline.
# ============================================================


# ------------------------------------------------------------
# Validate deployment input
# ------------------------------------------------------------

- name: Validate frontend deployment variables
  ansible.builtin.assert:
    that:
      - routepilot_image_tag is defined
      - routepilot_image_tag | length > 0
      - ghcr_username is defined
      - ghcr_username | length > 0
      - ghcr_token is defined
      - ghcr_token | length > 0

    fail_msg: >-
      RoutePilot image tag or GHCR credentials are missing.

  no_log: true


# ------------------------------------------------------------
# Runtime Nginx configuration
# ------------------------------------------------------------

- name: Ensure RoutePilot configuration directory exists
  ansible.builtin.file:
    path: /etc/routepilot
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Install frontend Nginx configuration
  ansible.builtin.template:
    src: frontend-nginx.conf.j2
    dest: /etc/routepilot/frontend-nginx.conf
    owner: root
    group: root
    mode: "0644"

  register: frontend_nginx_config


# ------------------------------------------------------------
# Pull exact CI artifact
# ------------------------------------------------------------

- name: Deploy RoutePilot frontend Docker image
  block:

    - name: Authenticate frontend host to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: true

      no_log: true


    - name: Pull RoutePilot frontend image
      community.docker.docker_image:
        name: ghcr.io/nadaaath/routepilot-frontend
        tag: "{{ routepilot_image_tag }}"
        source: pull
        state: present

      register: frontend_image


    - name: Run RoutePilot frontend container
      community.docker.docker_container:
        name: routepilot-frontend

        image: >-
          ghcr.io/nadaaath/routepilot-frontend:{{ routepilot_image_tag }}

        state: started
        restart_policy: unless-stopped

        published_ports:
          - "80:80"

        volumes:
          - "/etc/routepilot/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro"

        recreate: >-
          {{
            (frontend_image.changed | default(false))
            or
            (frontend_nginx_config.changed | default(false))
          }}


  always:

    - name: Log frontend host out from GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        state: absent

      no_log: true