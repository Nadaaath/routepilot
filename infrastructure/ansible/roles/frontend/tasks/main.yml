---
- name: Ensure frontend deployment directory exists
  ansible.builtin.file:
    path: /opt/routepilot
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"


# ---------------------------------------------------------
# Inspect Git repository
# ---------------------------------------------------------

- name: Check whether RoutePilot Git repository already exists
  ansible.builtin.stat:
    path: /opt/routepilot/.git
  register: routepilot_frontend_git


- name: Fetch latest GitHub information
  ansible.builtin.command:
    cmd: git -C /opt/routepilot fetch origin main
  become_user: ubuntu
  changed_when: false
  check_mode: false
  when: routepilot_frontend_git.stat.exists


- name: Get currently deployed Git commit
  ansible.builtin.command:
    cmd: git -C /opt/routepilot rev-parse HEAD
  register: frontend_commit_current
  changed_when: false
  check_mode: false
  when: routepilot_frontend_git.stat.exists


- name: Get latest remote Git commit
  ansible.builtin.command:
    cmd: git -C /opt/routepilot rev-parse origin/main
  register: frontend_commit_remote
  changed_when: false
  check_mode: false
  when: routepilot_frontend_git.stat.exists


- name: Find changed frontend files
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/routepilot
      - diff
      - --name-only
      - HEAD
      - origin/main
      - --
      - frontend/
  register: frontend_changed_files
  changed_when: false
  check_mode: false
  when: routepilot_frontend_git.stat.exists


- name: Decide whether frontend source changed
  ansible.builtin.set_fact:
    frontend_source_changed: >-
      {{
        (not routepilot_frontend_git.stat.exists)
        or
        (
          frontend_changed_files.stdout | default('') | trim | length > 0
        )
      }}


# ---------------------------------------------------------
# Update repository
# ---------------------------------------------------------

- name: Clone or update RoutePilot repository
  ansible.builtin.git:
    repo: "https://github.com/Nadaaath/routepilot.git"
    dest: /opt/routepilot
    version: main
    update: true
    force: false
  become_user: ubuntu


# ---------------------------------------------------------
# Nginx runtime configuration
# ---------------------------------------------------------

- name: Ensure RoutePilot configuration directory exists
  ansible.builtin.file:
    path: /etc/routepilot
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Install frontend Nginx configuration
  ansible.builtin.template:
    src: frontend-nginx.conf.j2
    dest: /etc/routepilot/frontend-nginx.conf
    owner: root
    group: root
    mode: "0644"
  register: frontend_nginx_config


# ---------------------------------------------------------
# Docker image
# ---------------------------------------------------------

- name: Build RoutePilot frontend Docker image
  community.docker.docker_image:
    name: routepilot-frontend
    tag: "1.0"
    source: build
    build:
      path: /opt/routepilot/frontend
    force_source: "{{ frontend_source_changed | bool }}"
  register: frontend_image


# ---------------------------------------------------------
# Frontend container
# ---------------------------------------------------------

- name: Run RoutePilot frontend container
  community.docker.docker_container:
    name: routepilot-frontend
    image: routepilot-frontend:1.0
    state: started
    restart_policy: unless-stopped

    published_ports:
      - "80:80"

    volumes:
      - "/etc/routepilot/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro"

    recreate: >-
      {{
        (frontend_image.changed | default(false))
        or
        (frontend_nginx_config.changed | default(false))
      }}